# Nginx 1.30 as a TLS reverse proxy in front of the Express monolith (ADR-05).
# Installation (Ubuntu/Debian):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/enrollment.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Replace enrollment.example.edu and the certificate paths with the real ones
# (for example, the ones generated by certbot / Let's Encrypt).

# Per-IP request limit for the API (protects against abuse and brute force).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream enrollment_app {
    server 127.0.0.1:3000;   # Express listens on localhost only (HOST=127.0.0.1)
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name enrollment.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name enrollment.example.edu;

    # --- TLS: versions 1.2 and 1.3 only ---
    ssl_certificate     /etc/letsencrypt/live/enrollment.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enrollment.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Forces the browser to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 100k;   # same as the express.json() limit

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Common headers towards Express
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST API
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://enrollment_app;
    }

    # /auth/dev-token does not exist in production: it is also blocked here.
    location /auth/ {
        return 404;
    }

    # Frontend and Bootstrap (served by Express; Nginx adds browser caching)
    location / {
        proxy_pass http://enrollment_app;
        location ~* \.(css|js|svg|woff2?)$ {
            proxy_pass http://enrollment_app;
            expires 7d;
        }
    }
}
