# Nginx 1.30 como proxy inverso con TLS delante del monolito Express (ADR-05).
# Instalación (Ubuntu/Debian):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/matricula.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Reemplace matricula.ejemplo.edu.ec y las rutas de los certificados por los reales
# (por ejemplo, los que genera certbot / Let's Encrypt).

# Límite de peticiones por IP para la API (protege contra abuso y fuerza bruta).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream matricula_app {
    server 127.0.0.1:3000;   # Express escucha solo en localhost (HOST=127.0.0.1)
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name matricula.ejemplo.edu.ec;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matricula.ejemplo.edu.ec;

    # --- TLS: solo versiones 1.2 y 1.3 ---
    ssl_certificate     /etc/letsencrypt/live/matricula.ejemplo.edu.ec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matricula.ejemplo.edu.ec/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Obliga al navegador a usar siempre HTTPS (1 año)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 100k;   # igual que el límite de express.json()

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Cabeceras comunes hacia Express
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API REST
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://matricula_app;
    }

    # /auth/dev-token no existe en producción: se bloquea también aquí.
    location /auth/ {
        return 404;
    }

    # Frontend y Bootstrap (los entrega Express; Nginx los guarda en caché del navegador)
    location / {
        proxy_pass http://matricula_app;
        location ~* \.(css|js|svg|woff2?)$ {
            proxy_pass http://matricula_app;
            expires 7d;
        }
    }
}
