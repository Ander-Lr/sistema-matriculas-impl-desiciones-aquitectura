<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Sistema de Gestión Académica
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<header>

  <h1>
    Sistema de Gestión Académica
  </h1>

  <p>
    Aplicación para análisis de características
    de arquitectura
  </p>

</header>


<main>

  <!-- ===================== -->
  <!-- ESTUDIANTES -->
  <!-- ===================== -->

  <section class="panel">

    <h2>
      Estudiantes
    </h2>

    <form id="formEstudiante">

      <input
        id="nombre"
        placeholder="Nombre"
        required
      >

      <input
        id="carrera"
        placeholder="Carrera"
        required
      >

      <input
        id="semestre"
        type="number"
        min="1"
        max="12"
        placeholder="Semestre"
        required
      >

      <button>
        Agregar estudiante
      </button>

    </form>


    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Nombre</th>
          <th>Carrera</th>
          <th>Semestre</th>

        </tr>

      </thead>

      <tbody
        id="tablaEstudiantes"
      ></tbody>

    </table>

  </section>


  <!-- ===================== -->
  <!-- CURSOS -->
  <!-- ===================== -->

  <section class="panel">

    <h2>
      Cursos
    </h2>

    <form id="formCurso">

      <input
        id="curso"
        placeholder="Curso"
        required
      >

      <input
        id="docente"
        placeholder="Docente"
        required
      >

      <input
        id="cupos"
        type="number"
        min="1"
        placeholder="Cupos"
        required
      >

      <button>
        Agregar curso
      </button>

    </form>


    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Curso</th>
          <th>Docente</th>
          <th>Cupos</th>

        </tr>

      </thead>

      <tbody
        id="tablaCursos"
      ></tbody>

    </table>

  </section>


  <!-- ===================== -->
  <!-- MATRÍCULAS -->
  <!-- ===================== -->

  <section class="panel">

    <h2>
      Matrículas
    </h2>

    <form id="formMatricula">

      <select
        id="estudianteSelect"
        required
      ></select>

      <select
        id="cursoSelect"
        required
      ></select>

      <button>
        Matricular
      </button>

    </form>

    <p id="mensaje"></p>


    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Estudiante</th>
          <th>Curso</th>

        </tr>

      </thead>

      <tbody
        id="tablaMatriculas"
      ></tbody>

    </table>

  </section>


  <!-- ===================== -->
  <!-- REPORTE -->
  <!-- ===================== -->

  <section class="panel">

    <h2>
      Reporte académico
    </h2>

    <button id="btnReporte">
      Generar reporte
    </button>

    <div id="reporte"></div>

  </section>

</main>


<footer>

  Práctica de Arquitectura de Software —
  Tema 1.1.3 Características de arquitectura

</footer>


<script src="app.js"></script>

</body>

</html>
