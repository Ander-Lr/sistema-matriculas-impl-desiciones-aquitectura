<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Enrollment System</title>
  <!-- Bootstrap served locally from node_modules (ADR-07): no CDN -->
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- ES modules: main.js imports api.js and ui.js (H13) -->
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container flex-wrap gap-2">
      <span class="navbar-brand mb-0 h1">University Enrollment System</span>

      <!-- Session panel (ADR-06). In development it requests the token from
           /auth/dev-token; in production this form is replaced by the identity
           provider's sign-in page. -->
      <form id="signInForm" class="d-flex flex-wrap align-items-center gap-2" aria-label="Sign in">
        <select id="sessionRole" class="form-select form-select-sm w-auto" aria-label="Role">
          <option value="staff">Administrative staff</option>
          <option value="student">Student</option>
        </select>
        <input id="sessionSub" class="form-control form-control-sm session-id" type="number" min="1" value="1"
               aria-label="User ID" title="User ID (for a student, their student ID)">
        <div class="form-check form-switch text-light mb-0">
          <input id="sessionMfa" class="form-check-input" type="checkbox" checked>
          <label class="form-check-label small" for="sessionMfa">MFA</label>
        </div>
        <button class="btn btn-sm btn-primary">Sign in</button>
      </form>

      <div id="activeSession" class="d-flex align-items-center gap-2 text-light" hidden>
        <span id="sessionText" class="small"></span>
        <button id="signOutButton" type="button" class="btn btn-sm btn-outline-light">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div id="sessionNotice" class="alert alert-info">
      Sign in to view and register information.
    </div>

    <div class="row g-4">
      <!-- STUDENTS -->
      <section class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Students</h2>
            <form id="studentForm" class="row g-2 mb-2" data-role="staff">
              <div class="col-sm-5"><input id="studentName" class="form-control" placeholder="Name" maxlength="120" required></div>
              <div class="col-sm-4"><input id="studentProgram" class="form-control" placeholder="Program" maxlength="120" required></div>
              <div class="col-sm-3"><input id="studentSemester" class="form-control" type="number" min="1" max="12" placeholder="Semester" required></div>
              <div class="col-12"><button class="btn btn-primary btn-sm">Add student</button></div>
            </form>
            <div id="studentMessage" class="message" role="status"></div>
            <input id="studentSearch" class="form-control form-control-sm mb-2" type="search" placeholder="Search students by name…">
            <div class="table-responsive table-scroll">
              <table class="table table-sm table-hover align-middle">
                <thead><tr><th>ID</th><th>Name</th><th>Program</th><th>Semester</th></tr></thead>
                <tbody id="studentsTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- COURSES -->
      <section class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Courses</h2>
            <form id="courseForm" class="row g-2 mb-2" data-role="staff">
              <div class="col-sm-5"><input id="courseName" class="form-control" placeholder="Course" maxlength="120" required></div>
              <div class="col-sm-4"><input id="courseInstructor" class="form-control" placeholder="Instructor" maxlength="120" required></div>
              <div class="col-sm-3"><input id="courseSeats" class="form-control" type="number" min="1" max="500" placeholder="Seats" required></div>
              <div class="col-12"><button class="btn btn-primary btn-sm">Add course</button></div>
            </form>
            <div id="courseMessage" class="message" role="status"></div>
            <input id="courseSearch" class="form-control form-control-sm mb-2" type="search" placeholder="Search courses by name…">
            <div class="table-responsive table-scroll">
              <table class="table table-sm table-hover align-middle">
                <thead><tr><th>ID</th><th>Course</th><th>Instructor</th><th>Seats</th></tr></thead>
                <tbody id="coursesTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- ENROLLMENTS -->
      <section class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Enrollments</h2>
            <form id="enrollmentForm" class="row g-2 mb-2">
              <div class="col-sm-6"><select id="studentSelect" class="form-select" aria-label="Student" required></select></div>
              <div class="col-sm-6"><select id="courseSelect" class="form-select" aria-label="Course" required></select></div>
              <div class="col-12"><button class="btn btn-primary btn-sm">Enroll</button></div>
            </form>
            <div id="enrollmentMessage" class="message" role="status"></div>
            <input id="enrollmentSearch" class="form-control form-control-sm mb-2" type="search" placeholder="Search by student or course…">
            <div class="table-responsive table-scroll">
              <table class="table table-sm table-hover align-middle">
                <thead><tr><th>ID</th><th>Student</th><th>Course</th></tr></thead>
                <tbody id="enrollmentsTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- REPORT -->
      <section class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Academic report</h2>
            <p class="text-body-secondary small mb-2">Available to administrative staff.</p>
            <button id="reportButton" class="btn btn-outline-primary btn-sm mb-3" data-role="staff">Generate report</button>
            <div id="reportMessage" class="message" role="status"></div>
            <div id="report" class="list-group"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="text-center text-body-secondary small py-4">
    Software Architecture — University Enrollment System
  </footer>
</body>
</html>
